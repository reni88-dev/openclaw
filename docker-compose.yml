# =============================================================================
# OpenClaw — Simple VPS-Style Container for EasyPanel (ARM64) + Gemini Proxy
# =============================================================================
# Usage:
#   docker compose up -d
#   docker exec -it openclaw bash
#   openclaw onboard
# =============================================================================

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw:arm64
    container_name: openclaw
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - openclaw-data:/root/.openclaw
    ports:
      - "18789:18789"
    init: true
    restart: unless-stopped

volumes:
  openclaw-data:
    driver: local
